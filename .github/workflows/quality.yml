name: Build quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Python ${{ matrix.python-version }} smoke build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and linter without optional model weights
        run: python -m pip install ".[dev]"
      - name: Lint Python modules
        run: ruff check analytics.py exporter.py graph.py main.py parser.py semantic.py visualizer.py
      - name: Compile modules
        run: python -m compileall -q analytics.py exporter.py graph.py main.py parser.py semantic.py visualizer.py
      - name: Build demo HTML and JSON without model download
        run: second-brain-graph demo_notes --no-semantic --output $RUNNER_TEMP/graph.html --json-output $RUNNER_TEMP/graph.json
      - name: Check generated artifacts
        run: python -c "import json,pathlib; p=pathlib.Path('$RUNNER_TEMP'); assert (p/'graph.html').stat().st_size > 10000; d=json.loads((p/'graph.json').read_text()); assert d['schema_version']=='1.0' and d['summary']['note_count']==5"
